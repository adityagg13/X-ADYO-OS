---
title: Gaming Configuration
description: >-
  Disables Game DVR background recording (a real framerate cost) and enables Game
  Mode. Applies to Windows 10 and Windows 11; nothing here breaks Xbox sign-in or
  Game Pass.
actions:
  - !writeStatus: {status: 'Configuring gaming settings'}

  # --- Game DVR / background recording off -------------------------------------------------
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\GameDVR', value: 'AllowGameDVR', data: '0', type: REG_DWORD}
  - !registryValue:
    path: 'HKCU\System\GameConfigStore'
    value: 'GameDVR_Enabled'
    data: '0'
    type: REG_DWORD
    scope: currentUser
  - !registryValue:
    path: 'HKCU\System\GameConfigStore'
    value: 'GameDVR_FSEBehaviorMode'
    data: '2'
    type: REG_DWORD
    scope: currentUser
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
    value: 'AppCaptureEnabled'
    data: '0'
    type: REG_DWORD
    scope: currentUser
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\GameBar'
    value: 'AutoGameModeEnabled'
    data: '1'
    type: REG_DWORD
    scope: currentUser
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\GameBar'
    value: 'AllowAutoGameMode'
    data: '1'
    type: REG_DWORD
    scope: currentUser
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\GameBar'
    value: 'ShowStartupPanel'
    data: '0'
    type: REG_DWORD
    scope: currentUser

  # --- Game Bar tips / "this is a game" prompts off ----------------------------------------
  - !registryValue:
    path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR'
    value: 'HistoricalCaptureEnabled'
    data: '0'
    type: REG_DWORD
    scope: currentUser

  # --- Power scheme hint for game mode (no-op on builds without it) ------------------------
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\PolicyManager\default\ApplicationManagement\AllowGameDVR', value: 'value', data: '0', type: REG_DWORD, errorAction: Log}
