---
title: Telemetry Tasks
description: >-
  Disables the scheduled tasks that gather and upload diagnostic data. Task paths
  are shared by Windows 10 and Windows 11; missing tasks are logged, never fatal.
onUpgrade: false
actions:
  - !writeStatus: {status: 'Disabling telemetry tasks'}

  # --- Application Experience --------------------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\Microsoft Compatibility Appraiser', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\ProgramDataUpdater', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Application Experience\AitAgent', operation: disable, errorAction: Log}

  # --- Customer Experience Improvement Program (Windows 10) --------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\Consolidator', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\UsbCeip', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Customer Experience Improvement Program\KernelCeipTask', operation: disable, errorAction: Log}

  # --- Feedback / SIUF ---------------------------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Feedback\Siuf\DmClient', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Feedback\Siuf\DmClientOnScenarioDownload', operation: disable, errorAction: Log}

  # --- Error reporting / disk diagnosis ----------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Error Reporting\QueueReporting', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\DiskDiagnostic\Microsoft-Windows-DiskDiagnosticDataCollector', operation: disable, errorAction: Log}

  # --- Program Inventory / SQM -------------------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\PI\Sqm-Tasks', operation: disable, errorAction: Log}

  # --- Speech model download ---------------------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Speech\SpeechModelDownloadTask', operation: disable, errorAction: Log}

  # --- Location / maps ---------------------------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Location\Notifications', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Maps\MapsToastTask', operation: disable, errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Maps\MapsUpdateTask', operation: disable, errorAction: Log}

  # --- Media sharing -----------------------------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Windows Media Sharing\UpdateLibrary', operation: disable, errorAction: Log}

  # --- Settings sync (Windows 10 only) -----------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\SettingSync\BackgroundUploadTask', operation: disable, builds: ['<22000'], errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\SettingSync\NetworkStateChangeTask', operation: disable, builds: ['<22000'], errorAction: Log}

  # --- Device census (Windows 11) ----------------------------------------------------------
  - !scheduledTask: {path: '\Microsoft\Windows\Device Information\Device', operation: disable, builds: ['>=22000'], errorAction: Log}
  - !scheduledTask: {path: '\Microsoft\Windows\Device Information\Device User', operation: disable, builds: ['>=22000'], errorAction: Log}
