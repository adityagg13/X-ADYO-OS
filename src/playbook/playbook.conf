<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>X-ADYO OS</Name>
	<Username>Adyo</Username>
	<Title>X-ADYO OS v1.0.0</Title>
	<ShortDescription>One playbook for every Windows 10 and 11 build</ShortDescription>
	<Description><![CDATA[X-ADYO OS is a transparent, reversible Windows 10 + Windows 11 optimization playbook built around one idea: your PC should be fast, quiet and private without losing anything it needs.

It removes bloat, cuts telemetry, tunes services and performance, and supports every Windows 10 build from 1809 up and every Windows 11 build up to 26H2 - with Safe, Balanced and Extreme presets.]]></Description>
	<Details>A build-aware Windows 10 + 11 optimization suite: performance, privacy and usability tuning with Safe, Balanced and Extreme presets, plus rollback support and a readable post-install report.</Details>
	<ProgressText><![CDATA[X-ADYO OS is backing up your current state, applying your chosen preset and generating an install report. A System Restore point is created first if you selected it. You can review every change afterwards in C:\Windows\X-ADYO-OS\install-report.html]]></ProgressText>
	<Version>1.0.0</Version>
	<SupportedBuilds>
		<!-- ===================== Windows 10 ===================== -->
		<!-- 1809 -->
		<string>17763</string>
		<!-- 1903 -->
		<string>18362</string>
		<!-- 1909 -->
		<string>18363</string>
		<!-- 2004 / 20H2 / 21H1 / 21H2 / 22H2 -->
		<string>19041</string>
		<string>19042</string>
		<string>19043</string>
		<string>19044</string>
		<string>19045</string>
		<!-- ===================== Windows 11 ===================== -->
		<!-- 21H2 -->
		<string>22000</string>
		<!-- 22H2 -->
		<string>22621</string>
		<!-- 23H2 -->
		<string>22631</string>
		<!-- 24H2 -->
		<string>26100</string>
		<!-- 25H2 -->
		<string>26200</string>
		<!-- 26H2 -->
		<string>26300</string>
		<!-- future servicing branch -->
		<string>28000</string>
	</SupportedBuilds>
	<UpgradableFrom>any</UpgradableFrom>
	<Requirements>
		<Requirement>Internet</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>PluggedIn</Requirement>
	</Requirements>
	<UniqueId>7d3f2b5e-9c41-4a68-8f02-ad7059e1c4d7</UniqueId>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
	<EstimatedMinutes>12</EstimatedMinutes>
	<SupportsISO>true</SupportsISO>
	<OOBE>
		<BulletPoints>
			<BulletPoint Icon="Rocket" Title="Performance"
			Description="Debloat, service tuning, power and network tweaks tuned for both Windows 10 and Windows 11 - no placebos, every change documented."/>
			<BulletPoint Icon="Privacy" Title="Privacy"
			Description="Telemetry, advertising ID, cloud content, search and AI data collection switched off, with Windows 10 and 11 specific paths."/>
			<BulletPoint Icon="Lock" Title="Control"
			Description="Safe, Balanced and Extreme presets, a System Restore point, full backups, one-click partial undo and an install report of every change."/>
		</BulletPoints>
		<Internet>Force</Internet>
	</OOBE>
	<ISO>
		<DisableBitLocker>true</DisableBitLocker>
		<DisableHardwareRequirements>true</DisableHardwareRequirements>
	</ISO>
	<Software>
		<Package Option="browser-brave" DefaultWebBrowser="true">
			<Name>brave</Name>
			<Title>Brave</Title>
			<Description>Chromium browser with a built-in ad and tracker blocker, plus optional Brave Rewards and Firewall + VPN.</Description>
			<Icon>brave.png</Icon>
		</Package>
		<Package Option="browser-firefox" DefaultWebBrowser="true">
			<Name>firefox</Name>
			<Title>Firefox</Title>
			<Description>Mozilla's independent browser: strict tracking protection, full extension support and heavy customization.</Description>
			<Icon>firefox.png</Icon>
		</Package>
		<Package Option="browser-chrome" DefaultWebBrowser="true">
			<Name>chrome</Name>
			<Title>Google Chrome</Title>
			<Description>Google's Chromium browser - the safest bet for site compatibility, DRM streaming and Google account sync.</Description>
			<Icon>chrome.png</Icon>
		</Package>
	</Software>
	<FeaturePages>
		<RadioPage IsRequired="true" DefaultOption="preset-balanced" Description="Choose a preset: Safe, Balanced (recommended), or Extreme.">
			<Options>
				<RadioOption>
					<Text>Safe - disable and debloat only</Text>
					<Name>preset-safe</Name>
				</RadioOption>
				<RadioOption>
					<Text>Balanced - recommended (default)</Text>
					<Name>preset-balanced</Name>
				</RadioOption>
				<RadioOption>
					<Text>Extreme - maximum debloat and performance</Text>
					<Name>preset-extreme</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="What does each preset change?" Link="https://github.com/adyo-os/playbook/blob/main/docs/PRESETS.md"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="rp-on" Description="X-ADYO OS can create a System Restore Point before any change is made.">
			<TopLine Text="Strongly recommended - enables rollback from Windows Recovery."/>
			<Options>
				<RadioOption>
					<Text>Create System Restore Point (recommended)</Text>
					<Name>rp-on</Name>
				</RadioOption>
				<RadioOption>
					<Text>Skip restore point</Text>
					<Name>rp-off</Name>
				</RadioOption>
			</Options>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="wu-auto" Description="Choose how Windows Updates are handled after installation.">
			<TopLine Text="Security updates matter - X-ADYO OS never disables updates."/>
			<Options>
				<RadioOption>
					<Text>Automatic Windows Updates (recommended)</Text>
					<Name>wu-auto</Name>
				</RadioOption>
				<RadioOption>
					<Text>Notify only - I install updates manually</Text>
					<Name>wu-notify</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Changeable later from the X-ADYO OS folder." Link="https://github.com/adyo-os/playbook/blob/main/docs/TROUBLESHOOTING.md"/>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Select which components you would like to include or exclude.">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Remove Microsoft Edge (install a browser next)</Text>
					<Name>opt-uninstall-edge</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove OneDrive</Text>
					<Name>remove-onedrive</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft Teams</Text>
					<Name>remove-teams</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove AI (Copilot, Recall) - Windows 11</Text>
					<Name>remove-ai</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Select which inbox apps you would like to remove.">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Remove Xbox apps (Game Pass may need them)</Text>
					<Name>remove-appx-xbox</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove MS Photos</Text>
					<Name>remove-appx-photos</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Remove Phone Link</Text>
					<Name>remove-appx-yourphone</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Remove Dev Home</Text>
					<Name>remove-appx-devhome</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Advanced options - these reduce security or compatibility. All are reversible.">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Disable CPU mitigations (older CPUs only)</Text>
					<Name>opt-disable-mitigations</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable Core Isolation / VBS (not recommended)</Text>
					<Name>opt-disable-vbs</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Maximum Performance power scheme (no power saving)</Text>
					<Name>opt-max-performance</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Everything here can be toggled after installation." Link="https://github.com/adyo-os/playbook/blob/main/docs/COMPATIBILITY.md"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Tuning extras - each has a real trade-off, so they stay off by default.">
			<Options>
				<CheckboxOption IsChecked="false">
					<Text>Disable Hibernation (frees disk, no Fast Startup)</Text>
					<Name>opt-disable-hibernation</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable SysMain / Superfetch (NVMe + 16 GB RAM)</Text>
					<Name>opt-disable-sysmain</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable search indexing (file search gets slower)</Text>
					<Name>opt-disable-search-indexing</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable GPU scheduling / HAGS (situational)</Text>
					<Name>opt-disable-hags</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Appearance and usability options. Safe for most users.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Apply the X-ADYO OS wallpaper and lock screen</Text>
					<Name>configure-wallpaper</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Enable Dark Mode</Text>
					<Name>configure-darkmode</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Enable Legacy Context Menu (Windows 11)</Text>
					<Name>configure-lcm</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable Transparency Effects</Text>
					<Name>configure-te</Name>
				</CheckboxOption>
			</Options>
		</CheckboxPage>
		<RadioImagePage IsRequired="true" CheckDefaultBrowser="true" DefaultOption="browser-brave" Description="Pick the browser X-ADYO OS installs and offers as your default.">
			<Options>
				<RadioImageOption>
					<Text>Google Chrome&#10;Best compatibility</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#4285F4</GradientTopColor>
					<GradientBottomColor>#0F9D58</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Brave&#10;Ad-block built in</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#FB542B</GradientTopColor>
					<GradientBottomColor>#392DD1</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox&#10;Privacy focused</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF3647</GradientTopColor>
					<GradientBottomColor>#FFC742</GradientBottomColor>
				</RadioImageOption>
			</Options>
		</RadioImagePage>
	</FeaturePages>
</Playbook>
